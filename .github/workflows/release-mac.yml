name: Release Mac RoomBoard App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "true"
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RoomBoard/package-lock.json

      - name: Install dependencies
        working-directory: RoomBoard
        shell: bash
        run: npm ci

      - name: Typecheck
        working-directory: RoomBoard
        shell: bash
        run: npm run typecheck

      - name: Verify Apple signing secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CSC_LINK" ] || missing+=("MAC_CSC_LINK")
          [ -n "$CSC_KEY_PASSWORD" ] || missing+=("MAC_CSC_KEY_PASSWORD")
          [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID")

          has_apple_id_credentials=false
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            has_apple_id_credentials=true
          fi

          has_api_key_credentials=false
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            has_api_key_credentials=true
          fi

          if [ "$has_apple_id_credentials" != "true" ] && [ "$has_api_key_credentials" != "true" ]; then
            missing+=("APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD or APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Prepare Apple notarization API key
        if: env.APPLE_API_KEY_P8 != ''
        shell: bash
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized Mac app
        working-directory: RoomBoard
        shell: bash
        run: npm run desktop:dist:mac:release

      - name: Verify Mac signing and Apple assessment
        shell: bash
        run: |
          shopt -s nullglob
          apps=(RoomBoard/dist/mac*/RoomBoard.app)
          dmgs=(RoomBoard/dist/*.dmg)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No packaged Mac app found for verification."
            exit 1
          fi
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No packaged Mac DMG found for verification."
            exit 1
          fi

          for app_path in "${apps[@]}"; do
            npm --prefix RoomBoard run mac:verify -- "$app_path"
          done

          for dmg_path in "${dmgs[@]}"; do
            npm --prefix RoomBoard run mac:verify -- "$dmg_path"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomboard-mac-release-${{ github.run_number }}
          path: |
            RoomBoard/dist/*.dmg
            RoomBoard/dist/*.zip
            RoomBoard/dist/latest*.yml
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(RoomBoard/dist/*.dmg RoomBoard/dist/*.zip RoomBoard/dist/latest*.yml)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Mac release assets were generated."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "RoomBoard $RELEASE_TAG" \
              --notes "Signed and notarized RoomBoard Mac app release." \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
