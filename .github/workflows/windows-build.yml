name: Windows Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
    paths:
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/release-windows.yml"
      - "RoomBoard/**"
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/release-windows.yml"
      - "RoomBoard/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash
        working-directory: RoomBoard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RoomBoard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run desktop:dist:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomboard-windows-installer-${{ github.sha }}
          path: |
            RoomBoard/dist/*.exe
            RoomBoard/dist/*.blockmap
            RoomBoard/dist/latest*.yml
          if-no-files-found: error
