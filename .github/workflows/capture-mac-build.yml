name: Capture Mac Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
      - "capture-v*"
      - "capture-mac-v*"
    paths:
      - ".github/workflows/capture-mac-build.yml"
      - ".github/workflows/release-capture-mac.yml"
      - "RoomBoard/**"
  pull_request:
    paths:
      - ".github/workflows/capture-mac-build.yml"
      - ".github/workflows/release-capture-mac.yml"
      - "RoomBoard/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-capture-mac:
    runs-on: macos-latest

    defaults:
      run:
        shell: bash
        working-directory: RoomBoard

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RoomBoard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Capture Mac installer
        run: npm run capture:dist:mac

      - name: Upload Capture Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomboard-capture-mac-installer-${{ github.sha }}
          path: |
            RoomBoard/dist-capture-mac/*.dmg
            RoomBoard/dist-capture-mac/*.zip
            RoomBoard/dist-capture-mac/latest*.yml
          if-no-files-found: error
