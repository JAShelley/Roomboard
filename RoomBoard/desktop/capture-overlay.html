<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomBoard Capture Overlay</title>
  <style>
    html,
    body {
      background: transparent;
      height: 100%;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
      width: 100%;
    }

    #outline {
      border: 2px solid rgba(16, 185, 129, 0.98);
      border-radius: 8px;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
      display: none;
      min-height: 18px;
      min-width: 18px;
      position: fixed;
    }

    #label {
      background: rgba(6, 78, 59, 0.96);
      border-radius: 999px;
      color: #ecfdf5;
      display: none;
      font: 700 12px/1.2 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      left: 0;
      letter-spacing: 0;
      max-width: 360px;
      overflow: hidden;
      padding: 6px 10px;
      position: fixed;
      text-overflow: ellipsis;
      top: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="outline"></div>
  <div id="label">RoomBoard Capture</div>
  <script src="./capture-overlay.js"></script>
</body>
</html>
