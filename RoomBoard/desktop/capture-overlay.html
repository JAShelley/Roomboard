<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomBoard Capture Overlay</title>
  <style>
    html,
    body {
      background: transparent;
      height: 100%;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
      width: 100%;
    }

    #outline {
      border: 3px solid #22c55e;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(4, 12, 16, 0.12), 0 0 22px rgba(34, 197, 94, 0.55);
      display: none;
      min-height: 18px;
      min-width: 18px;
      position: fixed;
    }

    #label {
      background: #16a34a;
      border-radius: 5px;
      color: #ffffff;
      display: none;
      font: 700 12px/1.3 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      left: 0;
      letter-spacing: 0;
      max-width: 360px;
      overflow: hidden;
      padding: 5px 8px;
      position: fixed;
      text-overflow: ellipsis;
      top: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="outline"></div>
  <div id="label">RoomBoard Capture</div>
  <script src="./capture-overlay.js"></script>
</body>
</html>
