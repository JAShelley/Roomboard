<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomBoard Capture</title>
  <link rel="stylesheet" href="./capture-ui.css">
</head>
<body>
  <main class="appShell">
    <header class="appHeader">
      <div>
        <div class="eyebrow">RoomBoard Capture</div>
        <h1>Quick Send</h1>
      </div>
      <button class="iconButton" id="refreshStatusBtn" type="button" title="Refresh status" aria-label="Refresh status">↻</button>
    </header>

    <details class="panel connectionPanel" id="connectionPanel">
      <summary>
        <span>Connection</span>
        <span class="statusLine summaryStatus" id="connectionStatus">Not connected.</span>
      </summary>
      <div class="twoCol">
        <label>
          Email
          <input autocomplete="username" id="emailInput" type="email">
        </label>
        <label>
          Password
          <input autocomplete="current-password" id="passwordInput" type="password">
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="loginBtn" type="button">Sign in</button>
        <button id="loadBoardBtn" type="button">Load board</button>
      </div>
    </details>

    <section class="panel capturePanel">
      <div class="panelHeader">
        <div>
          <div class="eyebrow">Capture</div>
          <h2>Appointment</h2>
        </div>
        <div class="actions">
          <button class="primary" id="armCaptureBtn" type="button">Capture</button>
          <button id="pasteClipboardBtn" type="button">Paste text</button>
          <button class="quiet" id="stopCaptureBtn" type="button">Cancel</button>
        </div>
      </div>
      <div class="statusLine" id="captureStatus">Ready.</div>
      <div class="hoverPreview" id="hoverPreview">No appointment selected.</div>
    </section>

    <section class="panel reviewPanel">
      <div class="panelHeader">
        <div>
          <div class="eyebrow">Review</div>
          <h2>Send appointment to the board</h2>
        </div>
        <button class="quiet" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="capturePreview" id="capturePreview" hidden>
        <img alt="Captured appointment preview" id="capturePreviewImage">
      </div>
      <input id="timeInput" type="hidden">
      <input id="reasonInput" type="hidden">
      <div class="formGrid">
        <label class="fieldFull">
          Room
          <select id="roomSelect"></select>
        </label>
        <label class="fieldFull">
          Patient
          <input id="patientNameInput" type="text">
        </label>
        <label>
          Type
          <select id="colorLabelSelect"></select>
        </label>
        <label>
          Doctor
          <select id="doctorSelect"></select>
        </label>
        <label>
          Tech
          <input id="techInput" type="text">
        </label>
        <label>
          Quick note
          <select id="quickNoteSelect"></select>
        </label>
        <label class="fieldFull">
          Notes
          <textarea id="notesInput" rows="4"></textarea>
        </label>
      </div>
      <div class="checkRow">
        <label><input id="roomReadyInput" type="checkbox"> Room ready</label>
        <label><input id="doctorReadyInput" type="checkbox"> Doctor ready</label>
      </div>
      <div class="footerBar">
        <div class="statusLine" id="sendStatus">No appointment captured.</div>
        <div class="actions">
          <button class="primary" id="sendBtn" type="button">Send</button>
          <button class="quiet" id="copyDiagnosticsBtn" type="button">Diagnostics</button>
        </div>
      </div>
      <details class="diagnosticsPanel">
        <summary>Diagnostics</summary>
        <pre id="diagnosticOutput">No capture yet.</pre>
      </details>
    </section>
  </main>
  <script src="./capture-ui.js"></script>
</body>
</html>
